### 一、 HTTP 请求-响应生命周期的认知图式

在深入具体状态码之前，必须建立**客户端 → CDN/反向代理 (Nginx) → 上游服务 (Node/Java/Python) → 数据库**的链路心智模型：

- **1xx (Informational)**: 协议握手与传输准备（如 101 Switching Protocols 升级为 WebSocket）；
- **2xx (Successful)**: 请求已被服务器接收、理解并成功交付（如 200 OK、204 No Content）；
- **3xx (Redirection)**: 资源寻址转移，客户端需配合发起二次请求以达成目标；
- **4xx (Client Error)**: **责任在客户端**，请求报文语法错误、未授权或路径不存在；
- **5xx (Server Error)**: **责任在服务端**，服务器在处理有效请求时发生崩溃或下游网络超时。

---

### 二、 核心混淆双璧：全景对比矩阵

| 状态码对照组 | 核心诱因 | 浏览器/客户端行为 | 经典排障场景 |
| :--- | :--- | :--- | :--- |
| **401 Unauthorized** | 缺少有效凭证 (未携带 Authorization 头或 Token 过期) | 弹出登录框或跳转 SSO 登录页 | 用户打开私人订单列表但未登录 |
| **403 Forbidden** | 凭证有效，但身份所拥有的角色/权限受限 | 提示“无权访问该资源”，重试登录无效 | 普通员工尝试访问财务超管后台接口 |
| **502 Bad Gateway** | 反向代理作为网关，向上游应用服务器请求时收到无效响应 | 直接返回错误页，链路中断 | 后端容器 OOM 崩溃或端口未正常监听 |
| **504 Gateway Timeout** | 反向代理等待上游处理超时，超过 proxy_read_timeout | 等待漫长转圈后超时中断 | 复杂大数据报表 SQL 慢查询卡死 |

### 三、 协商缓存决策模型 (The 304 Caching Tree)

浏览器发起资源请求时，优先检查本地强缓存（\`Cache-Control: max-age\`）。当强缓存失效时，发起**带条件请求 (Conditional Request)**：
1. 客户端携带 \`If-None-Match: "etag_hash"\`；

   - 若资源已改变：返回 **200 OK** 并携带最新实体报文。

### 一、 为什么以 -ic 结尾的动词变位必须加 k？

很多学习者将 \`picnicking\`、\`panicked\` 视作孤立奇怪的特例死记硬背。但如果从**英语正字法与语音学演变**切入：
- 在英语与古法语借词中，辅音字母 **c** 具有软硬两种发音：
  - 在 **a, o, u** 前发清脆的硬音 **/k/**（如 *cat, cold, cup*）；
  - 在 **e, i, y** 前发软音 **/s/**（如 *city, cell, cycle*）。
- 动词以 \`-ic\` 结尾时，结尾原发音为 **/k/**（如 *panic* /ˈpænɪk/）；
- 当我们要为它追加 \`-ing\` 或 \`-ed\` 时，词尾字母 c 紧邻了 **i** 或 **e**！如果不加干预，拼写成 \`panicing\` 会被自然拼读规则误读成 **/ˈpænɪsɪŋ/**！
- 因此，英语古人发明了**“插入保护性辅音字母 k”**的铁律：用字母 k 强行锁住 **/k/** 的发音！

### 一、 Python 的“一切皆对象”与内存指针模型

在 CPython 虚拟机实现中，所有变量本质上都是**指向堆中 PyObject 结构体的指针**：
\`\`\`c
struct _object {
    _PyObject_HEAD_EXTRA
    Py_ssize_t ob_refcnt;         // 引用计数
    struct _typeobject *ob_type;  // 类型对象指针
};
\`\`\`

- **不可变对象 (Immutable)**: \`int\`, \`float\`, \`str\`, \`tuple\`, \`frozenset\`。一旦创建，其内存地址中的值永不可更改！任何修改操作（如字符串拼接 \`s += 'a'\`）均是在堆中分配全新的内存对象；
- **可变对象 (Mutable)**: \`list\`, \`dict\`, \`set\`。可在自身内存地址内进行原地修改（In-place mutation），如 \`append\`、\`pop\`。

---

### 二、 默认参数跨调用共享陷阱 (The Default Arg Gotcha)

\`\`\`python
def append_to(item, target_list=[]):
    target_list.append(item)
    return target_list
\`\`\`

**为什么第二次调用会记住第一次的值？**
因为 Python 函数本身是一个**一级对象 (First-Class Object)**。默认参数表达式在**函数定义阶段（编译字节码时）**仅求值一次，并保存在函数对象的 \`__defaults__\` 元组中！所有未传该参数的调用，都在共享同一个列表引用！
**标准正解**：永远使用不可变对象 \`None\` 作为占位符：
\`\`\`python
def append_to(item, target_list=None):
    if target_list is None: target_list = []
\`\`\`

      const modes = ['focus', 'guide', 'overview'];
      modes.forEach(m => {
        const btn = document.getElementById('tab-' + m);
        if (m === mode) {
          btn.className = "px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
        } else {
          btn.className = "px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1.5 text-slate-400 hover:text-white";
        }
      });
      renderViewport();
    }

    function renderViewport() {
      const deck = DECKS_DATA[activeDeckId];
      const viewport = document.getElementById('study-viewport');
      const badge = document.getElementById('deck-meta-badge');
      const relationsList = document.getElementById('linked-entities-list');
      const countEl = document.getElementById('linked-count');

      badge.innerHTML = `
        <span>${deck.icon} ${deck.title}</span>
        <span>·</span>
        <span>${deck.categoriesCount} 分类 / ${deck.entitiesCount} 考点</span>
      `;

      // 渲染左侧关系网
      if (deck.guide && deck.guide.relations) {
        countEl.innerText = `${deck.guide.relations.length} 组核心对比`;
        relationsList.innerHTML = deck.guide.relations.map(rel => `
          <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-[11px] flex flex-col gap-1">
            <div class="flex items-center justify-between font-mono text-[10px]">
              <span class="text-indigo-400 font-bold">${rel.source} ↔ ${rel.target}</span>
              <span class="px-1.5 py-0.2 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">${rel.type}</span>
            </div>
            <p class="text-slate-300">${rel.label}</p>
          </div>
        `).join('');
      } else {
        countEl.innerText = '暂无关联映射';
        relationsList.innerHTML = `
          <div class="p-4 text-center text-slate-500 text-xs bg-slate-900/40 rounded-xl border border-slate-800/80">
            该题库尚未提炼关系对照对
          </div>
        `;
      }

      if (currentViewMode === 'guide') {
        renderGuideView(deck, viewport);
      } else if (currentViewMode === 'focus') {
        viewport.innerHTML = `
          <div class="p-12 text-center surface-inset rounded-2xl text-slate-400 space-y-3">
            <span class="text-3xl">🎯</span>
            <h3 class="text-sm font-bold text-slate-200">聚焦精读模式 (Focus Mode)</h3>
            <p class="text-xs text-slate-500 max-w-md mx-auto">以单考点为核心，三阶段逐级揭示释义遮罩、同胞辨析与易错陷阱。点击上方【📖 体系知识导读】可随时返回全局体系。</p>
          </div>
        `;
      } else {
        viewport.innerHTML = `
          <div class="p-12 text-center surface-inset rounded-2xl text-slate-400 space-y-3">
            <span class="text-3xl">🌲</span>
            <h3 class="text-sm font-bold text-slate-200">全景大纲模式 (Overview Matrix)</h3>
            <p class="text-xs text-slate-500 max-w-md mx-auto">多卡片平铺网格，查看全库所有考点的熟练度状态与分布。</p>
          </div>
        `;
      }
    }

    function renderGuideView(deck, container) {
      if (!deck.guide) {
        // 空状态：引导用户由 AI 生成
        container.innerHTML = `
          <div class="p-12 text-center surface-inset rounded-2xl border border-slate-800/80 space-y-4 max-w-lg mx-auto my-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-950/60 border border-indigo-700/50 flex items-center justify-center text-indigo-400 mx-auto text-xl">
              📖
            </div>
            <div>
              <h3 class="text-sm font-bold text-white">当前题库暂未编写体系化导读</h3>
              <p class="text-xs text-slate-400 mt-1 leading-relaxed">
                知识导读能将碎片考点串联为网状心智模型。您可以手动编写，或借助 AI Agent 智能助手一键提炼全库知识架构！
              </p>
            </div>
            <div class="pt-2">
              <button onclick="simulateAiGenerateGuide()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition flex items-center gap-2 mx-auto shadow-lg shadow-indigo-600/30">
                <svg class="w-4 h-4 text-current animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>呼叫 AI 智囊一键生成系统化导读</span>
              </button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <!-- 导读头部心智模型摘要卡片 -->
        <div class="mb-6 p-4 rounded-2xl bg-gradient-to-r from-indigo-950/70 via-slate-900 to-indigo-950/40 border border-indigo-800/50 shadow-md">
          <div class="flex items-center gap-2 text-indigo-400 font-mono text-xs font-bold mb-1.5">
            <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            <span>先行组织者 · 核心心智模型 (Advance Organizer)</span>
          </div>
          <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-sans font-medium">
            ${deck.guide.summary}
          </p>
        </div>

        <!-- 导读 Markdown 正文流 -->
        <div class="text-xs leading-relaxed text-slate-300 space-y-4 font-sans border-t border-slate-800/80 pt-4">
          ${deck.guide.markdown.replace(/### (.*?)\n/g, '<h3 class="text-sm font-bold text-white mt-6 mb-2 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>$1</h3>')
                               .replace(/#### (.*?)\n/g, '<h4 class="text-xs font-bold text-indigo-200 mt-4 mb-1">$1</h4>')
                               .replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre class="p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono text-[11px] text-emerald-400 my-2 overflow-x-auto">$2</pre>')
                               .replace(/\| (.*?) \|/g, (match) => match) // 表格暂简写
                               .replace(/\n\n/g, '<br><br>')}
        </div>

        <!-- 底部行动唤起 (CTA) -->
        <div class="mt-8 pt-4 border-t border-slate-800 flex items-center justify-between">
          <span class="text-xs text-slate-400">已理解体系心智框架？现在开启检索练习加深记忆：</span>
          <a href="../index.html" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition flex items-center gap-1.5 shadow-md shadow-indigo-600/30">
            <span>进入自由沙盒刷题 →</span>
          </a>
        </div>
      `;
    }

    function simulateAiGenerateGuide() {
      const deck = DECKS_DATA[activeDeckId];
      deck.guide = {
        summary: "Docker 的核心本质是利用 Linux 内核的 Namespace (环境隔离) 与 Cgroups (资源配额) 实现的轻量级进程级沙箱。核心掌握容器生命周期命令、数据卷只读挂载与网络互联驱动。",
        relations: [
          { source: "run", target: "start", type: "contrast", label: "docker run (创建+启动) vs docker start (唤醒已存在容器)" },
          { source: "-v", target: "--mount", type: "contrast", label: "-v 简写语法 vs --mount 现代强类型精确声明" }
        ],
        markdown: `
### 一、 容器与虚拟机的核心本质差异

容器并不是一个微型虚拟机，**容器本质上只是宿主机上的一个普通受限进程**！
- **Namespace (命名空间)**：实现六项隔离（PID进程树、NET网络栈、IPC通信、MNT挂载点、UTS主机名、USER用户）；
- **Cgroups (控制组)**：限制进程的资源配额上限（CPU使用核数、内存上限 Memory Limit、磁盘 I/O 权重）。

---

### 二、 容器生命周期四大核心状态机

1. **Created (已创建)**: 镜像层之上叠加了可写容器层，但未分配 PID；
2. **Running (运行中)**: 进程已在隔离命名空间内执行主进程 (CMD/ENTRYPOINT)；
3. **Paused (已暂停)**: 使用 cgroups freezer 冻结 CPU 时钟；
4. **Stopped / Exited (已停止)**: 收到 SIGTERM / SIGKILL 信号优雅退出。
        `
      };
      renderViewport();
    }

    // 初始化加载
    window.addEventListener('DOMContentLoaded', () => {
      selectDeck('deck_http');
    });
  </script>
</body>
