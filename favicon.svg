<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Top Face: Indigo / Brand Core -->
    <linearGradient id="prism-top" x1="16" y1="5" x2="16" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Left Face: Cyan / Memory Synapse -->
    <linearGradient id="prism-left" x1="7" y1="11" x2="16" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Right Face: Violet / Arena Challenge -->
    <linearGradient id="prism-right" x1="25" y1="11" x2="16" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- High-contrast drop shadow -->
    <filter id="crystal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- High-contrast dark plinth (Squircle) for tab visibility in dark & light themes -->
  <rect width="32" height="32" rx="7" fill="#090D16"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Knowledge Polyhedron Group -->
  <g filter="url(#crystal-shadow)">
    <!-- Top Isometric Face -->
    <polygon points="16,5.5 24.5,10.2 16,15 7.5,10.2" fill="url(#prism-top)"/>
    <!-- Left Isometric Face -->
    <polygon points="7.5,10.2 16,15 16,24.8 7.5,20" fill="url(#prism-left)"/>
    <!-- Right Isometric Face -->
    <polygon points="16,15 24.5,10.2 24.5,20 16,24.8" fill="url(#prism-right)"/>

    <!-- Central Illuminated Insight Core (Nexus of Mastery) -->
    <polygon points="16,12.5 18.5,15 16,17.5 13.5,15" fill="#FFFFFF"/>

    <!-- Synaptic Network Satellites (3D Knowledge Graph Nodes) -->
    <circle cx="16" cy="4.5" r="1.3" fill="#A5B4FC"/>
    <circle cx="6" cy="20.5" r="1.3" fill="#38BDF8"/>
    <circle cx="26" cy="20.5" r="1.3" fill="#C084FC"/>
  </g>
</svg>
